<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<style>
  body { margin: 0; overflow: hidden; background: #070a10; font-family: 'Segoe UI', sans-serif; }
  #hud {
    position: absolute; top: 32px; left: 40px; right: 40px;
    display: flex; justify-content: space-between; align-items: center; pointer-events: none;
  }
  .tag {
    background: rgba(15, 23, 42, 0.88); border-left: 5px solid #f59e0b;
    color: #f8fafc; padding: 12px 22px; border-radius: 6px; font-size: 22px; font-weight: 700;
  }
  .mode {
    background: #f59e0b; color: #090d16;
    padding: 8px 18px; border-radius: 6px; font-size: 18px; font-weight: 800; text-transform: uppercase;
  }
</style>
<script src="three.min.js"></script>
<script src="GLTFLoader.js"></script>
<script src="SkeletonUtils.js"></script>
</head>
<body>
<div id="hud">
  <div class="tag">Golpe de Palma Abierta · Tronco Bloqueado (0°)</div>
  <div class="mode" id="hud-speed">Velocidad Real</div>
</div>
<script>
window.sceneReady = false;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x070a10);
scene.fog = new THREE.Fog(0x070a10, 6, 15);

const camera = new THREE.PerspectiveCamera(40, 1920 / 1080, 0.1, 50);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(1920, 1080);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const keyLight = new THREE.DirectionalLight(0xfff7ed, 1.45);
keyLight.position.set(2.2, 5.2, 3.0);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
scene.add(keyLight);

const rimBlue = new THREE.DirectionalLight(0x38bdf8, 0.95);
rimBlue.position.set(-3.2, 3.0, -2.5);
scene.add(rimBlue);

const rimAmber = new THREE.DirectionalLight(0xf59e0b, 0.55);
rimAmber.position.set(3.0, 2.0, -2.5);
scene.add(rimAmber);

const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(20, 20),
  new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.78, metalness: 0.1 })
);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);
const grid = new THREE.GridHelper(16, 32, 0x334155, 0x1e293b);
grid.position.y = 0.002;
scene.add(grid);

function mapFighterBones(model, bodyColor, jointColor, addShoulderLaser) {
  const bones = {};
  model.traverse(obj => {
    if (obj.isMesh) {
      obj.castShadow = true;
      obj.receiveShadow = true;
      obj.frustumCulled = false;
      if (obj.name.toLowerCase().includes("joint")) {
        obj.material = new THREE.MeshStandardMaterial({ color: jointColor, roughness: 0.35, metalness: 0.4 });
      } else {
        obj.material = new THREE.MeshStandardMaterial({ color: bodyColor, roughness: 0.45, metalness: 0.25 });
      }
    }
    if (obj.isBone) bones[obj.name] = obj;
  });

  const baseHipY = bones.mixamorigHips ? bones.mixamorigHips.position.y : 95;

  if (addShoulderLaser && bones.mixamorigSpine2) {
    const laser = new THREE.Mesh(
      new THREE.CylinderGeometry(0.4, 0.4, 62, 10),
      new THREE.MeshBasicMaterial({ color: 0x38bdf8 })
    );
    laser.rotation.z = Math.PI / 2;
    laser.position.set(0, 12, 0);
    bones.mixamorigSpine2.add(laser);
  }
  return { bones, baseHipY };
}
let defModel, aggModel, defRig, aggRig;

const BONE_Y = new THREE.Vector3(0, 1, 0);

function solve2BoneIK(armBone, foreArmBone, targetWorld, poleWorld) {
  if (!armBone || !foreArmBone || !armBone.parent) return;
  armBone.parent.updateMatrixWorld(true);

  const S = armBone.getWorldPosition(new THREE.Vector3());
  const E = foreArmBone.getWorldPosition(new THREE.Vector3());
  const handBone = foreArmBone.children.find(c => c.isBone);
  const W = handBone ? handBone.getWorldPosition(new THREE.Vector3()) : E.clone().add(new THREE.Vector3(0, -0.25, 0));

  const L1 = Math.max(0.01, S.distanceTo(E));
  const L2 = Math.max(0.01, E.distanceTo(W));

  const toTarget = targetWorld.clone().sub(S);
  const dist = THREE.MathUtils.clamp(toTarget.length(), 0.05, (L1 + L2) * 0.992);
  const dir = toTarget.normalize();

  const cosAlpha = THREE.MathUtils.clamp((L1 * L1 + dist * dist - L2 * L2) / (2 * L1 * dist), -1, 1);
  const sinAlpha = Math.sqrt(Math.max(0, 1 - cosAlpha * cosAlpha));

  const poleVec = poleWorld.clone().sub(S);
  let bendAxis = dir.clone().cross(poleVec);
  if (bendAxis.lengthSq() < 0.0001) bendAxis.set(0, 1, 0);
  bendAxis.normalize();
  const bendDir = bendAxis.cross(dir).normalize();

  const upperDir = dir.clone().multiplyScalar(cosAlpha).addScaledVector(bendDir, sinAlpha).normalize();
  const elbowWorld = S.clone().addScaledVector(upperDir, L1);

  const localElbow = armBone.parent.worldToLocal(elbowWorld.clone());
  const dir1 = localElbow.sub(armBone.position).normalize();
  armBone.quaternion.setFromUnitVectors(BONE_Y, dir1);
  armBone.updateMatrixWorld(true);

  const localTarget = foreArmBone.parent.worldToLocal(targetWorld.clone());
  const dir2 = localTarget.sub(foreArmBone.position).normalize();
  foreArmBone.quaternion.setFromUnitVectors(BONE_Y, dir2);
  foreArmBone.updateMatrixWorld(true);
}

function aimHandWorld(handBone, fingerDirWorld, palmNormalWorld) {
  if (!handBone || !handBone.parent) return;
  handBone.parent.updateMatrixWorld(true);
  const W = handBone.getWorldPosition(new THREE.Vector3());
  const tipWorld = W.clone().addScaledVector(fingerDirWorld.clone().normalize(), 0.15);
  const localTip = handBone.parent.worldToLocal(tipWorld);
  const dir = localTip.sub(handBone.position).normalize();
  handBone.quaternion.setFromUnitVectors(BONE_Y, dir);
  handBone.updateMatrixWorld(true);

  const localPalm = handBone.worldToLocal(W.clone().add(palmNormalWorld));
  const angle = Math.atan2(localPalm.x, localPalm.z);
  handBone.rotateY(angle);
}

function setFingerCurl(bones, side, curl, thumbCurl) {
  const fingers = ['Index', 'Middle', 'Ring', 'Pinky'];
  fingers.forEach(f => {
    for (let i = 1; i <= 3; i++) {
      const b = bones[`mixamorig${side}Hand${f}${i}`];
      if (b) b.rotation.z = side === 'Left' ? -curl : curl;
    }
  });
  for (let i = 1; i <= 3; i++) {
    const t = bones[`mixamorig${side}HandThumb${i}`];
    if (t) t.rotation.z = side === 'Left' ? -thumbCurl : thumbCurl;
  }
}

function applyGuardPose(rig, model, isDef) {
  const { bones, baseHipY } = rig;
  if (!bones.mixamorigHips) return;

  const zDir = isDef ? 1 : -1;
  const xSign = isDef ? 1 : -1;

  bones.mixamorigHips.position.set(0, baseHipY - 3, 0);
  bones.mixamorigHips.rotation.set(0.05, isDef ? -0.14 : 0.14, 0);

  ['mixamorigSpine', 'mixamorigSpine1', 'mixamorigSpine2'].forEach(name => {
    if (bones[name]) bones[name].rotation.set(0.04, 0, 0);
  });
  if (bones.mixamorigNeck) bones.mixamorigNeck.rotation.set(-0.06, 0, 0);
  if (bones.mixamorigHead) bones.mixamorigHead.rotation.set(-0.04, isDef ? 0.12 : -0.12, 0);

  if (bones.mixamorigLeftUpLeg) bones.mixamorigLeftUpLeg.rotation.set(-0.30, 0, -0.05);
  if (bones.mixamorigLeftLeg) bones.mixamorigLeftLeg.rotation.set(0.46, 0, 0);
  if (bones.mixamorigLeftFoot) bones.mixamorigLeftFoot.rotation.set(-0.16, 0, 0);

  if (bones.mixamorigRightUpLeg) bones.mixamorigRightUpLeg.rotation.set(0.24, 0, 0.05);
  if (bones.mixamorigRightLeg) bones.mixamorigRightLeg.rotation.set(0.40, 0, 0);
  if (bones.mixamorigRightFoot) bones.mixamorigRightFoot.rotation.set(-0.20, 0, 0);

  model.updateMatrixWorld(true);

  const basePos = model.position;
  solve2BoneIK(
    bones.mixamorigLeftArm,
    bones.mixamorigLeftForeArm,
    new THREE.Vector3(basePos.x + 0.12 * xSign, 1.38, basePos.z + 0.28 * zDir),
    new THREE.Vector3(basePos.x + 0.28 * xSign, 0.95, basePos.z + 0.05 * zDir)
  );
  if (bones.mixamorigLeftHand) bones.mixamorigLeftHand.quaternion.identity();
  setFingerCurl(bones, 'Left', 1.15, 0.65);

  solve2BoneIK(
    bones.mixamorigRightArm,
    bones.mixamorigRightForeArm,
    new THREE.Vector3(basePos.x - 0.14 * xSign, 1.35, basePos.z + 0.22 * zDir),
    new THREE.Vector3(basePos.x - 0.28 * xSign, 0.95, basePos.z - 0.05 * zDir)
  );
  if (bones.mixamorigRightHand) bones.mixamorigRightHand.quaternion.identity();
  setFingerCurl(bones, 'Right', 1.15, 0.65);
}

function lerp(a, b, t) { return a + (b - a) * t; }

function ballisticCurve(t) {
  if (t <= 0) return 0;
  if (t < 0.22) {
    const p = t / 0.22;
    return p * p * p;
  }
  if (t < 0.42) return 1.0;
  if (t < 0.78) {
    const p = (t - 0.42) / 0.36;
    return 1.0 - (p * p * (3 - 2 * p));
  }
  return 0;
}

new THREE.GLTFLoader().load('Xbot.glb', gltf => {
  defModel = THREE.SkeletonUtils.clone(gltf.scene);
  aggModel = THREE.SkeletonUtils.clone(gltf.scene);

  defRig = mapFighterBones(defModel, 0x0284c7, 0x38bdf8, true);
  aggRig = mapFighterBones(aggModel, 0x334155, 0xef4444, false);

  defModel.position.set(0, 0, -0.50);
  aggModel.position.set(0, 0, 0.42);
  aggModel.rotation.y = Math.PI;

  scene.add(defModel);
  scene.add(aggModel);

  applyGuardPose(defRig, defModel, true);
  applyGuardPose(aggRig, aggModel, false);
  window.sceneReady = true;
});

window.renderFrame = function(ratio) {
  if (!window.sceneReady) return;

  defModel.position.set(0, 0, -0.50);
  aggModel.position.set(0, 0, 0.42);

  applyGuardPose(defRig, defModel, true);
  applyGuardPose(aggRig, aggModel, false);

  const defBones = defRig.bones;
  const aggBones = aggRig.bones;

  const isSlowMo = ratio >= 0.46;
  const hud = document.getElementById('hud-speed');
  hud.innerText = isSlowMo ? "Cámara Lenta (25%) · Perfil Biomecánico" : "Velocidad Real de Combate";
  hud.style.background = isSlowMo ? "#38bdf8" : "#f59e0b";

  let localT = !isSlowMo ? Math.max(0, (ratio - 0.08) / 0.34) : Math.max(0, (ratio - 0.54) / 0.44);
  const strike = ballisticCurve(localT);

  defModel.position.z = lerp(-0.50, -0.24, strike);
  defBones.mixamorigHips.position.y = defRig.baseHipY - lerp(3, 6, strike);
  defBones.mixamorigLeftUpLeg.rotation.x = lerp(-0.30, -0.48, strike);
  defBones.mixamorigLeftLeg.rotation.x = lerp(0.46, 0.62, strike);
  defModel.updateMatrixWorld(true);

  const chinTarget = new THREE.Vector3(0, 1.48, 0.34);

  if (strike > 0.01) {
    const startHand = new THREE.Vector3(0.12, 1.38, defModel.position.z + 0.28);
    const currentHand = startHand.clone().lerp(chinTarget, strike);

    solve2BoneIK(
      defBones.mixamorigLeftArm,
      defBones.mixamorigLeftForeArm,
      currentHand,
      new THREE.Vector3(0.24, 1.05, defModel.position.z + 0.15)
    );

    const fingerOpen = Math.min(1, strike * 2.5);
    setFingerCurl(defBones, 'Left', lerp(1.15, -0.05, fingerOpen), lerp(0.65, -0.15, fingerOpen));
    aimHandWorld(
      defBones.mixamorigLeftHand,
      new THREE.Vector3(0, 0.94, 0.34),
      new THREE.Vector3(0, -0.25, 0.96)
    );
  }

  const impact = Math.max(0, (strike - 0.85) / 0.15);
  if (aggBones.mixamorigNeck) aggBones.mixamorigNeck.rotation.x = -0.38 * impact;
  if (aggBones.mixamorigHead) aggBones.mixamorigHead.rotation.x = -0.48 * impact;
  if (aggBones.mixamorigSpine1) aggBones.mixamorigSpine1.rotation.x = -0.15 * impact;
  aggModel.position.z = lerp(0.42, 0.50, impact);

  const shake = impact > 0 ? Math.sin(ratio * 900) * 0.012 * impact : 0;
  const camAngle = isSlowMo ? lerp(0.60, 1.54, Math.min(1, (ratio - 0.46) * 4.5)) : 0.60;
  const dist = isSlowMo ? 1.85 : 2.15;
  camera.position.set(Math.sin(camAngle) * dist + shake, 1.42 + shake, Math.cos(camAngle) * dist);
  camera.lookAt(0, 1.34, 0.04);

  renderer.render(scene, camera);
};
</script>
</body>
</html>
