<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<style>
  body { margin: 0; overflow: hidden; background: #090d16; font-family: 'Segoe UI', sans-serif; }
  #hud {
    position: absolute; top: 32px; left: 40px; right: 40px;
    display: flex; justify-content: space-between; align-items: center; pointer-events: none;
  }
  .tag {
    background: rgba(15, 23, 42, 0.88); border-left: 5px solid #f59e0b;
    color: #f8fafc; padding: 12px 22px; border-radius: 6px; font-size: 22px; font-weight: 700;
  }
  .mode {
    background: #f59e0b; color: #090d16;
    padding: 8px 18px; border-radius: 6px; font-size: 18px; font-weight: 800; text-transform: uppercase;
  }
</style>
<script src="three.min.js"></script>
</head>
<body>
<div id="hud">
  <div class="tag">Golpe de Palma Abierta · Tronco Bloqueado (0°)</div>
  <div class="mode" id="hud-speed">Ejecución Técnica</div>
</div>
<script>
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x090d16);
scene.fog = new THREE.Fog(0x090d16, 5.5, 14);

const camera = new THREE.PerspectiveCamera(40, 1920 / 1080, 0.1, 50);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(1920, 1080);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 0.5));
const keyLight = new THREE.DirectionalLight(0xfff7ed, 1.3);
keyLight.position.set(2.5, 5.5, 3.5);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
scene.add(keyLight);

const rimLight = new THREE.DirectionalLight(0x38bdf8, 0.75);
rimLight.position.set(-3.5, 3.5, -2.5);
scene.add(rimLight);

const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(20, 20),
  new THREE.MeshStandardMaterial({ color: 0x111827, roughness: 0.85 })
);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);
const grid = new THREE.GridHelper(16, 32, 0x334155, 0x1e293b);
grid.position.y = 0.002;
scene.add(grid);

function makeCapsule(r, len, mat) {
  const geo = new THREE.CapsuleGeometry(r, Math.max(0.01, len - r * 2), 10, 18);
  geo.translate(0, -len / 2, 0);
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = true;
  return m;
}

function buildHand(matSkin) {
  const wrist = new THREE.Group();

  const palm = new THREE.Mesh(new THREE.BoxGeometry(0.082, 0.095, 0.026), matSkin);
  palm.position.set(0, -0.048, 0);
  palm.castShadow = true;
  wrist.add(palm);

  const heel = new THREE.Mesh(new THREE.SphereGeometry(0.022, 14, 14), matSkin);
  heel.scale.set(1.5, 0.8, 0.9);
  heel.position.set(0, -0.018, -0.012);
  wrist.add(heel);

  const fingerSpecs = [
    { x: -0.030, len: 0.072, r: 0.0085, splay: -0.07 },
    { x: -0.010, len: 0.080, r: 0.0090, splay: -0.02 },
    { x:  0.010, len: 0.075, r: 0.0085, splay:  0.03 },
    { x:  0.029, len: 0.060, r: 0.0075, splay:  0.08 }
  ];

  const fingers = fingerSpecs.map(spec => {
    const base = new THREE.Group();
    base.position.set(spec.x, -0.092, 0);
    base.rotation.z = spec.splay;
    wrist.add(base);

    const prox = makeCapsule(spec.r, spec.len * 0.55, matSkin);
    base.add(prox);

    const mid = new THREE.Group();
    mid.position.y = -spec.len * 0.55;
    prox.add(mid);
    mid.add(makeCapsule(spec.r * 0.88, spec.len * 0.45, matSkin));

    return { base, mid };
  });

  const thumbBase = new THREE.Group();
  thumbBase.position.set(-0.044, -0.042, -0.006);
  wrist.add(thumbBase);
  const thumbProx = makeCapsule(0.010, 0.036, matSkin);
  thumbBase.add(thumbProx);
  const thumbTip = new THREE.Group();
  thumbTip.position.y = -0.036;
  thumbProx.add(thumbTip);
  thumbTip.add(makeCapsule(0.0085, 0.028, matSkin));

  return { wrist, fingers, thumbBase, thumbTip };
}

function setHandPose(hand, mode) {
  if (mode === 'open_palm') {
    hand.fingers.forEach(f => {
      f.base.rotation.x = 0.08;
      f.mid.rotation.x = 0.05;
    });
    hand.thumbBase.rotation.set(-0.25, 0, -0.45);
    hand.thumbTip.rotation.x = -0.2;
  } else {
    hand.fingers.forEach(f => {
      f.base.rotation.x = -1.45;
      f.mid.rotation.x = -1.55;
    });
    hand.thumbBase.rotation.set(-0.8, -0.5, -0.3);
    hand.thumbTip.rotation.x = -1.1;
  }
}
function buildFighter(shirtHex, pantsHex, skinHex, showAxisGuide) {
  const matShirt = new THREE.MeshStandardMaterial({ color: shirtHex, roughness: 0.65 });
  const matPants = new THREE.MeshStandardMaterial({ color: pantsHex, roughness: 0.75 });
  const matSkin = new THREE.MeshStandardMaterial({ color: skinHex, roughness: 0.5 });
  const matShoe = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.4 });

  const root = new THREE.Group();
  const pelvis = new THREE.Group();
  pelvis.position.y = 0.94;
  root.add(pelvis);

  const hipMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.145, 0.14, 0.18, 20), matPants);
  hipMesh.scale.set(1.12, 1, 0.85);
  hipMesh.castShadow = true;
  pelvis.add(hipMesh);

  const torso = new THREE.Group();
  torso.position.y = 0.08;
  pelvis.add(torso);

  const abdomen = new THREE.Mesh(new THREE.CylinderGeometry(0.155, 0.14, 0.24, 20), matShirt);
  abdomen.scale.set(1.1, 1, 0.82);
  abdomen.position.y = 0.12;
  abdomen.castShadow = true;
  torso.add(abdomen);

  const chest = new THREE.Mesh(new THREE.CylinderGeometry(0.195, 0.155, 0.26, 20), matShirt);
  chest.scale.set(1.15, 1, 0.82);
  chest.position.y = 0.35;
  chest.castShadow = true;
  torso.add(chest);

  if (showAxisGuide) {
    const axisBar = new THREE.Mesh(
      new THREE.CylinderGeometry(0.006, 0.006, 0.62, 10),
      new THREE.MeshBasicMaterial({ color: 0x38bdf8 })
    );
    axisBar.rotation.z = Math.PI / 2;
    axisBar.position.set(0, 0.44, 0);
    torso.add(axisBar);
  }

  const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.065, 0.11, 16), matSkin);
  neck.position.set(0, 0.51, 0.01);
  torso.add(neck);

  const headGroup = new THREE.Group();
  headGroup.position.set(0, 0.56, 0.01);
  torso.add(headGroup);

  const cranium = new THREE.Mesh(new THREE.SphereGeometry(0.105, 22, 22), matSkin);
  cranium.scale.set(0.9, 1.08, 1.02);
  cranium.position.set(0, 0.08, 0);
  cranium.castShadow = true;
  headGroup.add(cranium);

  const jaw = new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.048, 0.085, 16), matSkin);
  jaw.position.set(0, 0.015, 0.032);
  jaw.rotation.x = -0.22;
  jaw.castShadow = true;
  headGroup.add(jaw);

  function makeArm(side) {
    const s = side === 'R' ? -1 : 1;
    const shoulder = new THREE.Group();
    shoulder.position.set(s * 0.225, 0.43, 0);
    torso.add(shoulder);

    const deltoid = new THREE.Mesh(new THREE.SphereGeometry(0.062, 16, 16), matShirt);
    shoulder.add(deltoid);

    const upper = makeCapsule(0.052, 0.27, matShirt);
    shoulder.add(upper);

    const elbow = new THREE.Group();
    elbow.position.y = -0.27;
    upper.add(elbow);

    const forearm = makeCapsule(0.044, 0.25, matSkin);
    elbow.add(forearm);

    const hand = buildHand(matSkin);
    hand.wrist.position.y = -0.25;
    if (side === 'R') hand.wrist.scale.x = -1;
    forearm.add(hand.wrist);
    setHandPose(hand, 'fist');

    return { shoulder, elbow, hand };
  }

  function makeLeg(side) {
    const s = side === 'R' ? -1 : 1;
    const hip = new THREE.Group();
    hip.position.set(s * 0.10, -0.05, 0);
    pelvis.add(hip);

    const thigh = makeCapsule(0.078, 0.43, matPants);
    hip.add(thigh);

    const knee = new THREE.Group();
    knee.position.y = -0.43;
    thigh.add(knee);

    const shin = makeCapsule(0.058, 0.42, matPants);
    knee.add(shin);

    const foot = new THREE.Mesh(new THREE.BoxGeometry(0.095, 0.055, 0.24), matShoe);
    foot.position.set(0, -0.435, 0.055);
    foot.castShadow = true;
    shin.add(foot);

    return { hip, knee };
  }

  return {
    root, pelvis, torso, headGroup,
    armL: makeArm('L'), armR: makeArm('R'),
    legL: makeLeg('L'), legR: makeLeg('R')
  };
}

const defender = buildFighter(0x0369a1, 0x1e293b, 0xe2b89b, true);
defender.root.position.set(0, 0, -0.54);
scene.add(defender.root);

const aggressor = buildFighter(0x374151, 0x111827, 0xd8a888, false);
aggressor.root.position.set(0, 0, 0.44);
aggressor.root.rotation.y = Math.PI;
scene.add(aggressor.root);

function applyGuard(f, isDef) {
  f.pelvis.position.y = 0.90;
  f.pelvis.rotation.y = isDef ? -0.18 : 0.20;
  f.torso.rotation.y = 0.0;
  f.headGroup.rotation.set(0, 0, 0);
  f.torso.rotation.x = 0.04;

  f.legL.hip.rotation.x = -0.32; f.legL.knee.rotation.x = 0.48;
  f.legR.hip.rotation.x = 0.28;  f.legR.knee.rotation.x = 0.42;

  f.armL.shoulder.rotation.set(-0.68, 0, 0.18);
  f.armL.elbow.rotation.set(-1.85, 0, 0);
  f.armL.hand.wrist.rotation.set(0, 0, 0);
  setHandPose(f.armL.hand, 'fist');

  f.armR.shoulder.rotation.set(-0.58, 0, -0.18);
  f.armR.elbow.rotation.set(-1.95, 0, 0);
  f.armR.hand.wrist.rotation.set(0, 0, 0);
  setHandPose(f.armR.hand, 'fist');
}

function lerp(a, b, t) { return a + (b - a) * t; }

window.renderFrame = function(ratio) {
  applyGuard(defender, true);
  applyGuard(aggressor, false);

  let strikePhase = 0;
  const isSlowMo = ratio >= 0.48;
  document.getElementById('hud-speed').innerText = isSlowMo ? "Cámara Lenta · Vista Lateral" : "Ejecución Técnica";
  document.getElementById('hud-speed').style.background = isSlowMo ? "#38bdf8" : "#f59e0b";

  if (!isSlowMo) {
    const local = ratio / 0.48;
    if (local > 0.18 && local < 0.48) strikePhase = (local - 0.18) / 0.30;
    else if (local >= 0.48 && local < 0.74) strikePhase = 1.0;
    else if (local >= 0.74) strikePhase = Math.max(0, 1 - (local - 0.74) / 0.26);
  } else {
    const local = (ratio - 0.48) / 0.52;
    if (local > 0.12 && local < 0.62) strikePhase = (local - 0.12) / 0.50;
    else if (local >= 0.62 && local < 0.85) strikePhase = 1.0;
    else if (local >= 0.85) strikePhase = Math.max(0, 1 - (local - 0.85) / 0.15);
  }

  const ease = strikePhase * strikePhase * (3 - 2 * strikePhase);

  if (ease > 0.15) setHandPose(defender.armL.hand, 'open_palm');

  defender.torso.rotation.y = 0.0;
  defender.root.position.z = lerp(-0.54, -0.30, ease);
  defender.legL.hip.rotation.x = lerp(-0.32, -0.46, ease);
  defender.legL.knee.rotation.x = lerp(0.48, 0.58, ease);

  defender.armL.shoulder.rotation.x = lerp(-0.68, -1.54, ease);
  defender.armL.shoulder.rotation.z = lerp(0.18, -0.16, ease);
  defender.armL.elbow.rotation.x = lerp(-1.85, -0.05, ease);
  defender.armL.hand.wrist.rotation.x = lerp(0, -1.46, ease);

  const impact = Math.max(0, (ease - 0.82) / 0.18);
  aggressor.headGroup.rotation.x = -0.45 * impact;
  aggressor.torso.rotation.x = -0.14 * impact;
  aggressor.root.position.z = lerp(0.44, 0.50, impact);

  const camAngle = isSlowMo ? lerp(0.62, 1.54, Math.min(1, (ratio - 0.48) * 3.2)) : 0.62;
  const dist = isSlowMo ? 1.95 : 2.25;
  camera.position.set(Math.sin(camAngle) * dist, 1.44, Math.cos(camAngle) * dist);
  camera.lookAt(0, 1.32, 0.05);

  renderer.render(scene, camera);
};
</script>
</body>
</html>
