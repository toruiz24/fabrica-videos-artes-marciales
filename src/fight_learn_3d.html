<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #070b14; overflow: hidden; font-family: 'DejaVu Sans', 'Segoe UI', sans-serif; }
  #hud {
    position: absolute; top: 36px; left: 48px; right: 48px;
    display: flex; justify-content: space-between; align-items: center; pointer-events: none;
  }
  .card {
    background: rgba(15, 23, 42, 0.90); border-left: 6px solid #f59e0b;
    padding: 16px 26px; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  .label { color: #f59e0b; font-size: 16px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; }
  .title { color: #f8fafc; font-size: 30px; font-weight: 800; margin-top: 4px; }
  .sub { color: #94a3b8; font-size: 18px; margin-top: 4px; }
  .badge {
    background: #f59e0b; color: #070b14; padding: 12px 24px;
    border-radius: 10px; font-size: 20px; font-weight: 900; letter-spacing: 1px;
  }
  #bar-wrap {
    position: absolute; bottom: 110px; left: 48px; right: 48px; height: 8px;
    background: rgba(255,255,255,0.12); border-radius: 4px; overflow: hidden;
  }
  #bar-fill { width: 0%; height: 100%; background: #38bdf8; }
</style>
<script src="three.min.js"></script>
<script src="GLTFLoader.js"></script>
<script src="SkeletonUtils.js"></script>
</head>
<body>
<div id="hud">
  <div class="card">
    <div class="label" id="hud-tag">TÉCNICA EXACTA · TRONCO BLOQUEADO (0°)</div>
    <div class="title" id="hud-title">GOLPE DE PALMA ABIERTA AL MENTÓN</div>
    <div class="sub" id="hud-sub">Paso corto adelante · Eje de hombros inmóvil · Impacto con talón de palma</div>
  </div>
  <div class="badge" id="hud-mode">FASE 1 · GUARDIA BASE</div>
</div>
<div id="bar-wrap"><div id="bar-fill"></div></div>

<script>
window.sceneReady = false;
let defModel, aggModel, defData, aggData, impactSphere, arrowGroup;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x070b14);
scene.fog = new THREE.Fog(0x070b14, 6, 16);

const camera = new THREE.PerspectiveCamera(40, 1920 / 1080, 0.1, 50);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(1920, 1080);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.25;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 0.7));
const keyLight = new THREE.DirectionalLight(0xfff7ed, 1.5);
keyLight.position.set(3, 6, 4);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
scene.add(keyLight);

const rimLight = new THREE.DirectionalLight(0x38bdf8, 1.1);
rimLight.position.set(-4, 4, -3);
scene.add(rimLight);

const floor = new THREE.Mesh(
  new THREE.CircleGeometry(6, 64),
  new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.8 })
);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

const ring = new THREE.Mesh(
  new THREE.RingGeometry(1.15, 1.22, 64),
  new THREE.MeshBasicMaterial({ color: 0x38bdf8, side: THREE.DoubleSide })
);
ring.rotation.x = -Math.PI / 2;
ring.position.y = 0.003;
scene.add(ring);

const grid = new THREE.GridHelper(12, 24, 0x1e293b, 0x111827);
grid.position.y = 0.001;
scene.add(grid);

impactSphere = new THREE.Mesh(
  new THREE.SphereGeometry(0.055, 20, 20),
  new THREE.MeshBasicMaterial({ color: 0xef4444, transparent: true, opacity: 0.9 })
);
impactSphere.position.set(0.02, 1.48, 0.34);
scene.add(impactSphere);

arrowGroup = new THREE.Group();
const shaft = new THREE.Mesh(
  new THREE.CylinderGeometry(0.012, 0.012, 0.44, 12),
  new THREE.MeshBasicMaterial({ color: 0xf59e0b })
);
shaft.rotation.x = Math.PI / 2;
shaft.position.set(0.06, 1.44, 0.06);
arrowGroup.add(shaft);

const tip = new THREE.Mesh(
  new THREE.ConeGeometry(0.032, 0.08, 16),
  new THREE.MeshBasicMaterial({ color: 0xf59e0b })
);
tip.rotation.x = Math.PI / 2;
tip.position.set(0.04, 1.46, 0.29);
arrowGroup.add(tip);
scene.add(arrowGroup);
function mapFighter(model, bodyColor, accentColor, isDef) {
  const bones = {};
  model.traverse(obj => {
    obj.frustumCulled = false;
    if (obj.isMesh) {
      obj.castShadow = true;
      obj.receiveShadow = true;
      const isJoint = obj.name.toLowerCase().includes("joint");
      obj.material = new THREE.MeshStandardMaterial({
        color: isJoint ? accentColor : bodyColor,
        roughness: 0.38,
        metalness: 0.25
      });
    }
    if (obj.isBone) bones[obj.name] = obj;
  });

  const baseHipY = bones.mixamorigHips ? bones.mixamorigHips.position.y : 94;

  if (isDef && bones.mixamorigSpine2) {
    const axis = new THREE.Mesh(
      new THREE.CylinderGeometry(0.45, 0.45, 58, 12),
      new THREE.MeshBasicMaterial({ color: 0x10b981 })
    );
    axis.rotation.z = Math.PI / 2;
    axis.position.set(0, 12, 0);
    bones.mixamorigSpine2.add(axis);
  }
  return { bones, baseHipY };
}

function setFingers(bones, side, curl, thumbCurl) {
  ['Index', 'Middle', 'Ring', 'Pinky'].forEach(f => {
    for (let i = 1; i <= 3; i++) {
      const b = bones[`mixamorig${side}Hand${f}${i}`];
      if (b) b.rotation.z = side === 'Left' ? -curl : curl;
    }
  });
  for (let i = 1; i <= 3; i++) {
    const t = bones[`mixamorig${side}HandThumb${i}`];
    if (t) t.rotation.z = side === 'Left' ? -thumbCurl : thumbCurl;
  }
}

function applyBaseGuard(data, isDef) {
  const { bones, baseHipY } = data;
  if (!bones.mixamorigHips) return;
  bones.mixamorigHips.position.set(0, baseHipY * 0.96, 0);
  bones.mixamorigHips.rotation.set(0.05, isDef ? -0.12 : 0.12, 0);

  ['mixamorigSpine', 'mixamorigSpine1', 'mixamorigSpine2'].forEach(n => {
    if (bones[n]) bones[n].rotation.set(0.03, 0, 0);
  });
  if (bones.mixamorigNeck) bones.mixamorigNeck.rotation.set(-0.05, 0, 0);
  if (bones.mixamorigHead) bones.mixamorigHead.rotation.set(-0.03, isDef ? 0.10 : -0.10, 0);

  if (bones.mixamorigLeftUpLeg) bones.mixamorigLeftUpLeg.rotation.set(-0.34, 0, -0.08);
  if (bones.mixamorigLeftLeg) bones.mixamorigLeftLeg.rotation.set(0.50, 0, 0);
  if (bones.mixamorigLeftFoot) bones.mixamorigLeftFoot.rotation.set(-0.16, 0, 0);

  if (bones.mixamorigRightUpLeg) bones.mixamorigRightUpLeg.rotation.set(0.28, 0, 0.08);
  if (bones.mixamorigRightLeg) bones.mixamorigRightLeg.rotation.set(0.42, 0, 0);
  if (bones.mixamorigRightFoot) bones.mixamorigRightFoot.rotation.set(-0.20, 0, 0);

  if (bones.mixamorigLeftArm) bones.mixamorigLeftArm.rotation.set(0.55, 0.22, -1.15);
  if (bones.mixamorigLeftForeArm) bones.mixamorigLeftForeArm.rotation.set(0, 0, -1.95);
  if (bones.mixamorigLeftHand) bones.mixamorigLeftHand.rotation.set(0, 0, 0);
  setFingers(bones, 'Left', 1.15, 0.65);

  if (bones.mixamorigRightArm) bones.mixamorigRightArm.rotation.set(0.60, -0.22, 1.18);
  if (bones.mixamorigRightForeArm) bones.mixamorigRightForeArm.rotation.set(0, 0, 2.02);
  if (bones.mixamorigRightHand) bones.mixamorigRightHand.rotation.set(0, 0, 0);
  setFingers(bones, 'Right', 1.15, 0.65);
}

function lerp(a, b, t) { return a + (b - a) * t; }
function smooth(t) { t = Math.max(0, Math.min(1, t)); return t * t * (3 - 2 * t); }

function strikeProfile(t) {
  if (t <= 0) return 0;
  if (t < 0.35) return smooth(t / 0.35);
  if (t < 0.65) return 1.0;
  if (t < 1.0) return 1.0 - smooth((t - 0.65) / 0.35);
  return 0;
}

new THREE.GLTFLoader().load('Xbot.glb', gltf => {
  defModel = THREE.SkeletonUtils.clone(gltf.scene);
  aggModel = THREE.SkeletonUtils.clone(gltf.scene);

  defData = mapFighter(defModel, 0xe2e8f0, 0x38bdf8, true);
  aggData = mapFighter(aggModel, 0x475569, 0xef4444, false);

  defModel.position.set(0, 0, -0.52);
  aggModel.position.set(0, 0, 0.44);
  aggModel.rotation.y = Math.PI;

  scene.add(defModel);
  scene.add(aggModel);

  applyBaseGuard(defData, true);
  applyBaseGuard(aggData, false);
  window.sceneReady = true;
});

window.renderFrame = function(ratio) {
  if (!window.sceneReady) return;
  applyBaseGuard(defData, true);
  applyBaseGuard(aggData, false);

  const badge = document.getElementById('hud-mode');
  document.getElementById('bar-fill').style.width = `${Math.round(ratio * 100)}%`;

  let strike = 0;
  if (ratio < 0.16) {
    badge.innerText = 'FASE 1 · GUARDIA BASE';
    badge.style.background = '#94a3b8';
    strike = 0;
  } else if (ratio < 0.50) {
    badge.innerText = 'FASE 2 · EJECUCIÓN TÉCNICA';
    badge.style.background = '#f59e0b';
    strike = strikeProfile((ratio - 0.16) / 0.34);
  } else {
    badge.innerText = 'FASE 3 · CÁMARA LENTA (PERFIL)';
    badge.style.background = '#38bdf8';
    strike = strikeProfile((ratio - 0.50) / 0.50);
  }

  defModel.position.z = lerp(-0.52, -0.22, strike);
  defData.bones.mixamorigHips.position.y = defData.baseHipY * lerp(0.96, 0.92, strike);
  defData.bones.mixamorigLeftUpLeg.rotation.x = lerp(-0.34, -0.52, strike);
  defData.bones.mixamorigLeftLeg.rotation.x = lerp(0.50, 0.66, strike);

  const openT = Math.min(1, strike * 2.2);
  setFingers(defData.bones, 'Left', lerp(1.15, -0.05, openT), lerp(0.65, -0.15, openT));

  defData.bones.mixamorigLeftArm.rotation.set(
    lerp(0.55, 1.38, strike),
    lerp(0.22, -0.15, strike),
    lerp(-1.15, -0.10, strike)
  );
  defData.bones.mixamorigLeftForeArm.rotation.set(0, 0, lerp(-1.95, -0.06, strike));
  defData.bones.mixamorigLeftHand.rotation.set(lerp(0, -1.15, strike), lerp(0, 0.25, strike), lerp(0, 0.65, strike));

  const impact = Math.max(0, (strike - 0.85) / 0.15);
  if (aggData.bones.mixamorigNeck) aggData.bones.mixamorigNeck.rotation.x = -0.32 * impact;
  if (aggData.bones.mixamorigHead) aggData.bones.mixamorigHead.rotation.x = -0.42 * impact;
  aggModel.position.z = lerp(0.44, 0.52, impact);

  impactSphere.scale.setScalar(1.0 + impact * 0.6);
  arrowGroup.visible = strike > 0.05;

  const camAngle = ratio >= 0.50 ? lerp(0.65, 1.55, Math.min(1, (ratio - 0.50) * 4.0)) : 0.65;
  const dist = ratio >= 0.50 ? 2.15 : 2.35;
  camera.position.set(Math.sin(camAngle) * dist, 1.38, Math.cos(camAngle) * dist);
  camera.lookAt(0, 1.18, 0.02);

  renderer.render(scene, camera);
};
</script>
</body>
</html>
