name: Prueba Clip IA Real

on:
  workflow_dispatch:

jobs:
  test-hf:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install huggingface_hub gradio_client edge-tts

      - name: Generar clip de prueba
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python src/test_hf_video.py

      - name: Publicar video
        uses: actions/upload-artifact@v4
        with:
          name: test-palma-ia-real-mp4
          path: output/test_palma_ia_real.mp4
