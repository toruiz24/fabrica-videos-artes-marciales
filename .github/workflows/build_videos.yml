name: Fabrica Documental de Videos

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */8 * * *'
  push:
    paths:
      - 'input/*.pdf'

jobs:
  generar-documentales:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: 1. Clonar repositorio
        uses: actions/checkout@v4

      - name: 2. Restaurar progreso guardado
        uses: actions/cache/restore@v4
        with:
          path: build
          key: fabrica-doc-hd-v4-${{ hashFiles('input/*.pdf') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            fabrica-doc-hd-v4-${{ hashFiles('input/*.pdf') }}-

      - name: 3. Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 4. Instalar FFmpeg y librerias
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install -r requirements.txt
          pip install playwright
          playwright install chromium
          playwright install-deps chromium

      - name: 5. Dividir libro por capitulos reales
        run: python src/1_extract_chapters.py

      - name: 6. Generar guiones con director tecnico
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python src/2_generate_script.py

      - name: 7. Producir escenas HD con IA y contexto real
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python src/3_render_scenes.py

      - name: 8. Compilar documentales MP4 completos
        run: python src/4_compile_video.py

      - name: 9. Guardar progreso en cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: build
          key: fabrica-doc-hd-v4-${{ hashFiles('input/*.pdf') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: 10. Publicar capitulos terminados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: documentales-artes-marciales-hd
          path: output/*.mp4
          if-no-files-found: ignore
          retention-days: 30
