name: Auto-Instalar Fabrica de Videos

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  instalar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generar estructura y archivos
        run: |
          python3 -c '
          import os, urllib.request
          os.makedirs(".github/workflows", exist_ok=True)
          os.makedirs("input", exist_ok=True)
          os.makedirs("src", exist_ok=True)
          open("input/.gitkeep", "w").close()
          open("requirements.txt", "w").write("google-genai==0.8.0\npymupdf==1.24.10\nedge-tts==6.1.12\nplaywright==1.47.0\npydantic==2.9.2\n")
          print("Base creada")
          '

      - name: Commit y Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          git add .
          git commit -m "Paso 1: Estructura base creada"
          git push
